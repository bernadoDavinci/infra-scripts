name: Shell checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: for f in setup.sh install/*.sh; do bash -n "$f"; done
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
